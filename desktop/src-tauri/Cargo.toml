[package]
name = "howbout-companion"
version = "0.1.0"
description = "A private desktop companion for Howbout calendar exports"
authors = ["Howbout Companion contributors"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "howbout_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
keyring = "4.1.6"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "charset", "http2"] }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }
url = "2.5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
